  <script>
    // DATI INIZIALI PRE-POPOLATI DEL GUESTBOOK
    const guestbookEntries = [
      {
        id: 1,
        name: "Rocker_85",
        city: "Bologna",
        email: "rocker85@metalmail.it",
        website: "",
        date: "2024-03-05 17:40",
        message: "Ciao Joe! Ho appena scaricato Opus 1 da Mediafire e lo sto riascoltando a tutto volume in macchina. La traccia dei chitarroni è una bomba atomica! Continua così!"
      },
      {
        id: 2,
        name: "Elena G.",
        city: "Torino",
        email: "",
        website: "https://youtube.com",
        date: "2024-03-04 11:15",
        message: "Complimenti fantastica la cover dei Metallica (Damage, Inc.) su YouTube! La precisione nel picking a quella velocità è incredibile. Fai una cover dei Megadeth prossimamente?"
      },
      {
        id: 3,
        name: "Shredder_Joe_Fan",
        city: "Roma",
        email: "shredder@guitar.com",
        website: "",
        date: "2024-03-02 21:05",
        message: "Passavo di qua a lasciare un saluto. Seguo il sito da un bel po' e apprezzo sempre i tuoi lavori e le registrazioni nello studio. Un grande abbraccio!"
      },
      {
        id: 4,
        name: "Luca M.",
        city: "Verona",
        email: "",
        website: "",
        date: "2024-02-28 14:30",
        message: "Grande Joe! Saluti da Verona! Quando ci sarà il prossimo concerto o sessione Live?"
      }
    ];

    // FORMATTATIONE DATA ORA ATTUALE
    function getCurrentDateTime() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
    }

    // MOSTRA NOTIFICA DI CONFERMA (TOAST)
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
    }

    // RENDERING LISTA MESSAGGI E CONTATORE
    function renderEntries() {
      const container = document.getElementById('entriesList');
      const counter = document.getElementById('totalCounter');
      
      counter.innerText = `Messaggi totali: ${guestbookEntries.length}`;

      if (guestbookEntries.length === 0) {
        container.innerHTML = `<div class="no-entries">Ancora nessun messaggio presente. Sii il primo a firmare il libro degli ospiti!</div>`;
        return;
      }

      let html = '';
      guestbookEntries.forEach(entry => {
        html += `
          <div class="entry-card">
            <div class="entry-header">
              <div class="entry-author">✍️ ${escapeHtml(entry.name)}</div>
              <div class="entry-meta">
                ${entry.city ? `<span>📍 ${escapeHtml(entry.city)}</span>` : ''}
                <span>📅 ${entry.date}</span>
              </div>
            </div>
            <div class="entry-body">${escapeHtml(entry.message)}</div>
            ${(entry.website || entry.email) ? `
              <div class="entry-footer">
                ${entry.website ? `<a href="${escapeHtml(entry.website)}" target="_blank" rel="noopener">🌐 Visita il sito/canale</a>` : ''}
                ${entry.email ? `<span>✉️ Email fornita</span>` : ''}
              </div>
            ` : ''}
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // GESTIONE INVIO DEL FORM
    function handleFormSubmit(e) {
      e.preventDefault();
      
      const name = document.getElementById('gbName').value.trim();
      const city = document.getElementById('gbCity').value.trim();
      const email = document.getElementById('gbEmail').value.trim();
      const website = document.getElementById('gbWebsite').value.trim();
      const message = document.getElementById('gbMessage').value.trim();

      if (!name || !message) return;

      const newEntry = {
        id: Date.now(),
        name: name,
        city: city,
        email: email,
        website: website,
        date: getCurrentDateTime(),
        message: message
      };

      // Inserisce in cima alla lista
      guestbookEntries.unshift(newEntry);
      renderEntries();

      // Reset del form e notifica
      document.getElementById('guestbookForm').reset();
      showToast("Grazie! Il tuo messaggio è stato aggiunto al Libro degli Ospiti.");
    }

    // PREVENZIONE XSS
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // CARICAMENTO INIZIALE
    window.onload = function() {
      renderEntries();
    };
  </script>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'it',
      includedLanguages: 'en',
      autoDisplay: false
    }, 'google_translate_element');
  }

  function translateToEnglish() {
    // Carica dinamicamente lo script di Google Translate al click se non è già presente
    if (!document.getElementById('google-translate-script')) {
      var script = document.createElement('script');
      script.id = 'google-translate-script';
      script.type = 'text/javascript';
      script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      document.body.appendChild(script);
      
      // Attende il caricamento ed esegue il cambio di lingua
      var checkInterval = setInterval(function() {
        var select = document.querySelector('.goog-te-combo');
        if (select) {
          select.value = 'en';
          select.dispatchEvent(new Event('change'));
          clearInterval(checkInterval);
        }
      }, 300);
    } else {
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = 'en';
        select.dispatchEvent(new Event('change'));
      }
    }
  }
</script></body>
