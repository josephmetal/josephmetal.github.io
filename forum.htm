    // STATO CORRENTE DEL VISTO (navigation state)
    let currentCatId = null;
    let currentTopicId = null;

    // MOSTRA MESSAGGIO TOAST
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
    }

    // UTILS FORMATTAZIONE DATA ORA
    function getCurrentDateTime() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
    }

    // RENDERING VISTA 1: ELENCO CATEGORIE (HOME FORUM)
    function showCategoryList() {
      currentCatId = null;
      currentTopicId = null;

      // Update Breadcrumb
      document.getElementById('breadcrumbNav').innerHTML = `<span>Forum Home</span>`;
      document.getElementById('actionButtonContainer').innerHTML = '';

      let html = `
        <table class="forum-table">
          <thead>
            <tr>
              <th style="width: 50px;"></th>
              <th>Sezione / Categoria</th>
              <th style="width: 100px; text-align: center;">Discussioni</th>
              <th style="width: 180px;">Ultimo Messaggio</th>
            </tr>
          </thead>
          <tbody>
      `;

      forumData.categories.forEach(cat => {
        const topicCount = cat.topics.length;
        let lastPostText = 'Nessun messaggio';

        if (topicCount > 0) {
          const lastTopic = cat.topics[cat.topics.length - 1];
          const lastPost = lastTopic.posts[lastTopic.posts.length - 1];
          lastPostText = `<div><strong>${escapeHtml(lastTopic.title.substring(0, 20))}...</strong></div>
                          <div class="topic-author">da ${escapeHtml(lastPost.author)} il ${lastPost.date}</div>`;
        }

        html += `
          <tr>
            <td style="text-align: center;"><div class="cat-icon">${cat.icon}</div></td>
            <td>
              <a href="javascript:void(0)" class="cat-title" onclick="showTopicList('${cat.id}')">${escapeHtml(cat.title)}</a>
              <div class="cat-desc">${escapeHtml(cat.description)}</div>
            </td>
            <td style="text-align: center; font-weight: bold; color: #ff6666;">${topicCount}</td>
            <td><div class="last-post-info">${lastPostText}</div></td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById('forumView').innerHTML = html;
    }

    // RENDERING VISTA 2: LISTA DISCUSSIONS IN UNA CATEGORIA
    function showTopicList(catId) {
      currentCatId = catId;
      currentTopicId = null;

      const category = forumData.categories.find(c => c.id === catId);
      if (!category) return;

      // Update Breadcrumb
      document.getElementById('breadcrumbNav').innerHTML = `
        <a href="javascript:void(0)" onclick="showCategoryList()">Forum Home</a> &gt; 
        <span>${escapeHtml(category.title)}</span>
      `;

      // Botton per nuovo argomento
      document.getElementById('actionButtonContainer').innerHTML = `
        <button class="btn-action" onclick="showNewTopicForm()">+ Nuovo Argomento</button>
      `;

      let html = `
        <table class="forum-table">
          <thead>
            <tr>
              <th>Titolo Discussione</th>
              <th style="width: 120px;">Autore</th>
              <th style="width: 80px; text-align: center;">Risposte</th>
              <th style="width: 160px;">Ultimo Intervento</th>
            </tr>
          </thead>
          <tbody>
      `;

      if (category.topics.length === 0) {
        html += `<tr><td colspan="4" style="text-align:center; padding: 20px; color:#777;">Ancora nessuna discussione aperta in questa sezione. Creane una tu!</td></tr>`;
      } else {
        category.topics.forEach(topic => {
          const replyCount = topic.posts.length - 1;
          const lastPost = topic.posts[topic.posts.length - 1];

          html += `
            <tr>
              <td>
                <a href="javascript:void(0)" class="cat-title" onclick="showTopicDetail('${catId}', '${topic.id}')">${escapeHtml(topic.title)}</a>
                <div class="topic-author">Aperto il ${topic.date}</div>
              </td>
              <td><span class="topic-author">${escapeHtml(topic.author)}</span></td>
              <td style="text-align: center; font-weight: bold;">${replyCount}</td>
              <td>
                <div class="last-post-info">
                  da <strong>${escapeHtml(lastPost.author)}</strong><br>${lastPost.date}
                </div>
              </td>
            </tr>
          `;
        });
      }

      html += `</tbody></table>`;
      document.getElementById('forumView').innerHTML = html;
    }

    // RENDERING VISTA 3: DETTAGLIO DISCUSSIONE E POSTS
    function showTopicDetail(catId, topicId) {
      currentCatId = catId;
      currentTopicId = topicId;

      const category = forumData.categories.find(c => c.id === catId);
      if (!category) return;
      const topic = category.topics.find(t => t.id === topicId);
      if (!topic) return;

      // Update Breadcrumb
      document.getElementById('breadcrumbNav').innerHTML = `
        <a href="javascript:void(0)" onclick="showCategoryList()">Forum Home</a> &gt; 
        <a href="javascript:void(0)" onclick="showTopicList('${catId}')">${escapeHtml(category.title)}</a> &gt; 
        <span>${escapeHtml(topic.title)}</span>
      `;

      document.getElementById('actionButtonContainer').innerHTML = `
        <button class="btn-action btn-secondary" onclick="showTopicList('${catId}')">&laquo; Torna alla lista</button>
      `;

      let html = `<h2 style="color:#ff6666; font-size: 1.25rem; margin-bottom: 15px;">${escapeHtml(topic.title)}</h2>`;

      // Render di tutti i post
      topic.posts.forEach((post, index) => {
        html += `
          <div class="topic-post">
            <div class="post-header">
              <span class="post-author">#${index + 1} ${escapeHtml(post.author)}</span>
              <span class="post-date">${post.date}</span>
            </div>
            <div class="post-body">${escapeHtml(post.content)}</div>
          </div>
        `;
      });

      // Form per inserire una nuova risposta
      html += `
        <div class="form-card">
          <h3>Rispondi a questa discussione</h3>
          <form onsubmit="handleNewReply(event)">
            <div class="form-group">
              <label for="replyAuthor">Il tuo Nome / Nickname:</label>
              <input type="text" id="replyAuthor" required placeholder="Inserisci il tuo nome">
            </div>
            <div class="form-group">
              <label for="replyContent">Messaggio:</label>
              <textarea id="replyContent" rows="4" required placeholder="Scrivi la tua risposta..."></textarea>
            </div>
            <button type="submit" class="btn-action">Invia Risposta</button>
          </form>
        </div>
      `;

      document.getElementById('forumView').innerHTML = html;
    }

    // FORM NUOVO ARGOMENTO
    function showNewTopicForm() {
      const category = forumData.categories.find(c => c.id === currentCatId);
      if (!category) return;

      document.getElementById('breadcrumbNav').innerHTML = `
        <a href="javascript:void(0)" onclick="showCategoryList()">Forum Home</a> &gt; 
        <a href="javascript:void(0)" onclick="showTopicList('${currentCatId}')">${escapeHtml(category.title)}</a> &gt; 
        <span>Nuova Discussione</span>
      `;

      document.getElementById('actionButtonContainer').innerHTML = `
        <button class="btn-action btn-secondary" onclick="showTopicList('${currentCatId}')">Annulla</button>
      `;

      let html = `
        <div class="form-card" style="margin-top:0;">
          <h3>Crea un nuovo argomento in: ${escapeHtml(category.title)}</h3>
          <form onsubmit="handleNewTopic(event)">
            <div class="form-group">
              <label for="topicTitle">Titolo dell'argomento:</label>
              <input type="text" id="topicTitle" required placeholder="Inserisci un titolo chiaro e descrittivo">
            </div>
            <div class="form-group">
              <label for="topicAuthor">Il tuo Nome / Nickname:</label>
              <input type="text" id="topicAuthor" required placeholder="Inserisci il tuo nome">
            </div>
            <div class="form-group">
              <label for="topicContent">Messaggio iniziale:</label>
              <textarea id="topicContent" rows="6" required placeholder="Scrivi il contenuto della discussione..."></textarea>
            </div>
            <button type="submit" class="btn-action">Pubblica Discussione</button>
          </form>
        </div>
      `;

      document.getElementById('forumView').innerHTML = html;
    }

    // HANDLER CREAZIONE NUOVA DISCUSSIONE
    function handleNewTopic(e) {
      e.preventDefault();
      const title = document.getElementById('topicTitle').value.trim();
      const author = document.getElementById('topicAuthor').value.trim();
      const content = document.getElementById('topicContent').value.trim();

      if (!title || !author || !content) return;

      const category = forumData.categories.find(c => c.id === currentCatId);
      if (!category) return;

      const newTopicId = 'top-' + Date.now();
      const newTopic = {
        id: newTopicId,
        title: title,
        author: author,
        date: getCurrentDateTime(),
        posts: [
          {
            author: author,
            date: getCurrentDateTime(),
            content: content
          }
        ]
      };

      category.topics.unshift(newTopic); // Aggiunge in testa
      showToast('Nuovo argomento creato con successo!');
      showTopicDetail(currentCatId, newTopicId);
    }

    // HANDLER CREAZIONE NUOVA RISPOSTA
    function handleNewReply(e) {
      e.preventDefault();
      const author = document.getElementById('replyAuthor').value.trim();
      const content = document.getElementById('replyContent').value.trim();

      if (!author || !content) return;

      const category = forumData.categories.find(c => c.id === currentCatId);
      if (!category) return;
      const topic = category.topics.find(t => t.id === currentTopicId);
      if (!topic) return;

      topic.posts.push({
        author: author,
        date: getCurrentDateTime(),
        content: content
      });

      showToast('Risposta inviata con successo!');
      showTopicDetail(currentCatId, currentTopicId);
    }

    // UTILITÀ PER ESCAPE HTML PER PREVENIRE XSS
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // CARICAMENTO INIZIALE
    window.onload = function() {
      showCategoryList();
    };
  </script>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'it',
      includedLanguages: 'en',
      autoDisplay: false
    }, 'google_translate_element');
  }

  function translateToEnglish() {
    // Carica dinamicamente lo script di Google Translate al click se non è già presente
    if (!document.getElementById('google-translate-script')) {
      var script = document.createElement('script');
      script.id = 'google-translate-script';
      script.type = 'text/javascript';
      script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      document.body.appendChild(script);
      
      // Attende il caricamento ed esegue il cambio di lingua
      var checkInterval = setInterval(function() {
        var select = document.querySelector('.goog-te-combo');
        if (select) {
          select.value = 'en';
          select.dispatchEvent(new Event('change'));
          clearInterval(checkInterval);
        }
      }, 300);
    } else {
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = 'en';
        select.dispatchEvent(new Event('change'));
      }
    }
  }
